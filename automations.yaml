# A5 — Safety Shutoff (Critical Watchdog)
# ---------------------------------------------------------------------------
# Ensures the valve cannot remain open indefinitely.
# If switch.water_timer has been ON for 10 minutes it is forced OFF,
# regardless of how it was started.
# This automation fires even if the valve was turned on manually or by
# another unexpected mechanism, providing a hard safety boundary.
# ---------------------------------------------------------------------------

- id: a5_safety_shutoff
  alias: "A5 — Safety Shutoff (Valve Watchdog)"
  description: >
    Hard safety limit: turn off the irrigation valve if it has been ON
    for 10 minutes or more.

  trigger:
    - platform: state
      entity_id: switch.water_timer
      to: "on"
      for: "00:10:00"

  action:
    - action: switch.turn_off
      target:
        entity_id: switch.water_timer

  mode: single

# A6 — Sensor Failure Notification
# ---------------------------------------------------------------------------
# Continuously monitors the soil moisture sensor.  Fires a mobile
# notification as soon as the sensor becomes unavailable or its last update
# is more than 6 hours old.
#
# Note: A3 / A4 handle the actual fallback watering; this automation is
# purely informational so the user can investigate the sensor issue.
# ---------------------------------------------------------------------------

- id: a6_sensor_failure_notification
  alias: "A6 — Soil Sensor Failure Notification"
  description: >
    Send a mobile notification when the soil moisture sensor is
    unavailable or has not reported for more than 6 hours.

  trigger:
    - platform: template
      value_template: >
        {% set s = states.sensor.soil_sensor_soil_moisture %}
        {{ s is none
           or s.state in ['unknown', 'unavailable', 'none']
           or (now() - s.last_updated).total_seconds() > 21600 }}

  action:
    # Replace notify.notify with your device-specific service, e.g.
    # notify.mobile_app_<your_device_id>, if you want a push notification.
    - action: notify.notify
      data:
        message: >
          ⚠️ Soil sensor unavailable or stale — fallback watering active

  mode: single

# A7 — Reset Daily Watering Flags (Midnight)
# ---------------------------------------------------------------------------
# Resets both run-tracking input_booleans to 'off' at midnight so that
# each new day begins with both watering windows available.
# ---------------------------------------------------------------------------

- id: a7_reset_watering_flags
  alias: "A7 — Reset Daily Watering Flags at Midnight"
  description: >
    Reset input_boolean.garden_watered_morning and
    input_boolean.garden_watered_evening at 00:00 each day.

  trigger:
    - platform: time
      at: "00:00:00"

  action:
    - action: input_boolean.turn_off
      target:
        entity_id:
          - input_boolean.garden_watered_morning
          - input_boolean.garden_watered_evening

  mode: single
