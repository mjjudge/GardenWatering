# Garden watering automations (single-file format)
# ---------------------------------------------------------------------------
# This file contains all automations as one YAML list.
# Use in configuration.yaml with:
#   automation: !include automations.yaml
# ---------------------------------------------------------------------------

# A1 — Morning Watering (Soil-Based, Primary Mode)
# ---------------------------------------------------------------------------
# Triggers at 06:00 and waters for 10 minutes when:
#   • Soil moisture is below the dry threshold (35 %)
#   • No rain is forecast for tomorrow
#   • Both the water timer and soil sensor batteries are above 20 %
#   • The morning window has not already been used today
# ---------------------------------------------------------------------------

- id: a1_morning_watering_soil_based
  alias: "A1 — Morning Watering (Soil-Based)"
  description: >
    Primary morning watering based on soil moisture reading at 06:00.

  trigger:
    - platform: time
      at: "06:00:00"

  condition:
    # 1. Soil moisture is below the dry threshold
    - condition: numeric_state
      entity_id: sensor.soil_sensor_soil_moisture
      below: 35

    # 2. Soil sensor reading is current and valid (not stale / unavailable)
    - condition: template
      value_template: >
        {% set s = states.sensor.soil_sensor_soil_moisture %}
        {{ s is not none
           and s.state not in ['unknown', 'unavailable', 'none']
           and (now() - s.last_updated).total_seconds() <= 21600 }}

    # 3. Water timer battery is above minimum
    - condition: numeric_state
      entity_id: sensor.water_timer_battery
      above: 20

    # 4. Soil sensor battery is above minimum
    - condition: numeric_state
      entity_id: sensor.soil_sensor_battery
      above: 20

    # 5. Morning window has not already been used today
    - condition: state
      entity_id: input_boolean.garden_watered_morning
      state: "off"

  action:
    # Fetch the daily weather forecast.
    # Uses weather.get_forecasts (HA 2024.8+) — the forecast attribute was removed.
    - action: weather.get_forecasts
      data:
        type: daily
      target:
        entity_id: weather.home
      response_variable: forecast_response

    # 6. Stop if rain is forecast for tomorrow
    - condition: template
      value_template: >
        {% set fc = forecast_response['weather.home'].forecast %}
        {{ fc | length >= 2
           and fc[1].condition not in ['rainy', 'pouring', 'lightning-rainy'] }}

    # Mark the morning window as used
    - action: input_boolean.turn_on
      target:
        entity_id: input_boolean.garden_watered_morning

    # Open the valve
    - action: switch.turn_on
      target:
        entity_id: switch.water_timer

    # Run for the normal watering duration (10 minutes)
    - delay: "00:10:00"

    # Close the valve
    - action: switch.turn_off
      target:
        entity_id: switch.water_timer

  mode: single

