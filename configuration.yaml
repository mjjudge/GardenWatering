# Garden Watering Automation — Home Assistant Configuration
# ---------------------------------------------------------------------------
# This file shows the lines you need to ADD to your existing
# /config/configuration.yaml.  Do NOT replace your entire file with this.
#
# Step-by-step deployment instructions are in README.md.
# ---------------------------------------------------------------------------

# ---------------------------------------------------------------------------
# Input booleans — run-tracking per watering window
# ---------------------------------------------------------------------------
# If you do not already have an input_boolean: section, add this line as-is.
# If you already have input_boolean: defined, paste the contents of
# input_boolean.yaml directly into that section instead.
# ---------------------------------------------------------------------------
input_boolean: !include input_boolean.yaml

# ---------------------------------------------------------------------------
# Automations — single-file list
# ---------------------------------------------------------------------------
# If you do not already have an automation: section, add this line as-is.
# If you already have automation: !include automations.yaml,
# just merge your existing automations and the repo automations into one file.
# Only one automation: key should exist in configuration.yaml.
# ---------------------------------------------------------------------------
automation: !include automations.yaml
