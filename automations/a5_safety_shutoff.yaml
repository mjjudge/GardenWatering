# A5 — Safety Shutoff (Critical Watchdog)
# ---------------------------------------------------------------------------
# Ensures the valve cannot remain open indefinitely.
# If switch.water_timer has been ON for 10 minutes it is forced OFF,
# regardless of how it was started.
# This automation fires even if the valve was turned on manually or by
# another unexpected mechanism, providing a hard safety boundary.
# ---------------------------------------------------------------------------

- id: a5_safety_shutoff
  alias: "A5 — Safety Shutoff (Valve Watchdog)"
  description: >
    Hard safety limit: turn off the irrigation valve if it has been ON
    for 10 minutes or more.

  trigger:
    - platform: state
      entity_id: switch.water_timer
      to: "on"
      for: "00:10:00"

  action:
    - service: switch.turn_off
      target:
        entity_id: switch.water_timer

  mode: single
